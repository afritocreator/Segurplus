# Cascada de proveedores de extracción de facturas -- Bloque 2 del plan de
# rediseño de septiembre 2026 (ver docs/banco_extraccion.md). Se intentan en
# orden; si uno falla (cuota agotada, red caída, JSON inválido), se
# reintenta con backoff corto y después se pasa al siguiente. Nunca
# hardcodeado en core/ (ver CLAUDE.md).
#
# El pipeline real (core/pipeline.py::procesar_pdf) todavía NO usa esta
# cascada -- sigue llamando a Gemini directo (con su propio reintento, ver
# core/pipeline.py::procesar_pdf, E-6 de docs/auditoria-2026-09-web.md).
# Esta configuración la usa hoy scripts/banco_extraccion.py para medir.
#
# `variable_entorno_clave` es el NOMBRE de la variable de entorno que
# guarda la clave de API de ese proveedor -- nunca la clave en sí.
#
# docs/auditoria-2026-09-web.md, E-20: Groq (groq_scout, groq_qwen) estuvo
# acá, pero se sacó por decisión del usuario -- no por un resultado técnico
# (el problema real era que este entorno de desarrollo no podía llegar a
# api.groq.com, ver docs/estado.md). El código y los tests de
# core/extraccion/proveedores/openai_compat.py siguen andando: agregar una
# entrada acá alcanza para retomarlo si en algún momento se decide medirlo
# de nuevo.
vigencia_desde: "2026-09-23"
timeout_segundos: 25

proveedores:
  - nombre: gemini
    tipo: gemini
    modelo: gemini-3.6-flash
    variable_entorno_clave: GEMINI_API_KEY
