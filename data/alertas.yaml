# Umbrales de alertas -- CLAUDE.md: nunca hardcodear estos números en el código.
# vigencia_desde: desde cuándo rige este set de umbrales (por si se recalibran).

vigencia_desde: "2026-09-13"

# Puntos porcentuales por encima de la inflación del período que disparan
# la alerta de "precio unitario aumentó más que el IPC".
precio_por_encima_del_ipc_pp: 5.0

# Cualquier recargo (mora, interés, refacturación) dispara alerta siempre --
# no debería existir uno solo en una factura sana, así que no hay umbral,
# hay presencia/ausencia.
alertar_cualquier_recargo: true

# Variación de cantidad (líneas, chips, medidores) respecto del período
# anterior que dispara alerta, en proporción (0.30 = 30%).
salto_de_cantidad_ratio: 0.30

# Días de tolerancia entre facturas del mismo servicio antes de marcar
# "período faltante" o "factura fuera de rango".
dias_tolerancia_periodo: 10

# Proporción mínima (0.60 = 60%) de la variación total que un solo efecto
# (cantidad o precio) tiene que explicar para que el tablero diga "el
# aumento fue mayormente por CANTIDAD/PRECIO". Por debajo de esto se
# muestra como "mixto" -- ni cantidad ni precio explican la mayor parte
# por sí solos. Ver core/analisis/variacion.py::efecto_dominante.
umbral_efecto_dominante: 0.60

# Proporción mínima (0.15 = 15%) del movimiento total (en pesos) que tienen
# que pesar impuestos + recargos - créditos para que el relato en
# castellano mencione esa composición por separado ("de esa diferencia, $X
# son impuestos..."). Por debajo de esto, la frase sería ruido: casi todo
# el cambio ya es de consumo y no hace falta aclararlo. Ver
# core/relato.py::generar_relato_determinista, docs/auditoria-2026-09-web.md
# E-3 (antes el relato no distinguía consumo de impuestos y atribuía a
# "precio" un cambio que en realidad era de un impuesto nuevo).
umbral_composicion_relato: 0.15
