# Parámetros operativos del piloto -- CLAUDE.md: nunca hardcodear esto en el código.

# Si es true, toda factura recién procesada queda en estado "requiere_revision"
# y no impacta Evolución, alertas ni el Excel hasta que alguien la aprueba
# (de a una o en lote) desde la página "Revisar facturas" -- ver
# core/almacenamiento.py::decision_factura / aprobar_pendientes.
#
# En false (el default de este piloto, con una o dos personas cargando y
# revisando su propia carga), la factura queda "aprobada" directo al
# guardarse -- el registro de auditoría (quién cargó, cuándo) se sigue
# escribiendo igual en los dos casos, así que no se pierde trazabilidad al
# apagar este interruptor. Se prevé encenderlo cuando haya más de una
# persona cargando facturas sin supervisión cruzada.
revision_humana_obligatoria: false

# Tope de llamadas a Gemini por hora (docs/auditoria-2026-09-piloto.md,
# hallazgo A-7 / B-4) -- antes era una constante en
# core/extraccion/gemini.py, movida acá porque CLAUDE.md prohíbe
# hardcodear parámetros operativos. Se hace cumplir contando llamadas
# REALES (tabla intentos_gemini, ver core/almacenamiento.py), no un proxy
# de qué se terminó guardando. El tier gratuito de Gemini da margen de
# sobra para un equipo chico -- este número es un freno propio contra un
# loop o un mal uso del tablero, no el límite real de la API.
max_llamadas_gemini_por_hora: 30
