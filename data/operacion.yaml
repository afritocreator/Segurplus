# Parámetros operativos del piloto -- CLAUDE.md: nunca hardcodear esto en el código.

# Si es true, toda factura recién procesada queda en estado "requiere_revision"
# y no impacta Evolución, alertas ni el Excel hasta que alguien la aprueba
# (de a una o en lote) desde la página "Revisar facturas" -- ver
# core/almacenamiento.py::decision_factura / aprobar_pendientes.
#
# En false (el default de este piloto, con una o dos personas cargando y
# revisando su propia carga), la factura queda "aprobada" directo al
# guardarse -- el registro de auditoría (quién cargó, cuándo) se sigue
# escribiendo igual en los dos casos, así que no se pierde trazabilidad al
# apagar este interruptor. Se prevé encenderlo cuando haya más de una
# persona cargando facturas sin supervisión cruzada.
revision_humana_obligatoria: false

# Tope de llamadas a Gemini por hora (docs/auditoria-2026-09-piloto.md,
# hallazgo A-7 / B-4) -- antes era una constante en
# core/extraccion/gemini.py, movida acá porque CLAUDE.md prohíbe
# hardcodear parámetros operativos. Se hace cumplir contando llamadas
# REALES (tabla intentos_gemini, ver core/almacenamiento.py), no un proxy
# de qué se terminó guardando. El tier gratuito de Gemini da margen de
# sobra para un equipo chico -- este número es un freno propio contra un
# loop o un mal uso del tablero, no el límite real de la API.
max_llamadas_gemini_por_hora: 30

# Zona horaria del equipo que usa el tablero (docs/auditoria-2026-09-
# facturas-reales.md, hallazgo C-8) -- Streamlit Community Cloud corre en
# UTC; sin esto, "probá de nuevo después de las HH:MM" mostraba la hora del
# SERVIDOR, adelantada 3 horas respecto del reloj real de Tandil.
zona_horaria: America/Argentina/Buenos_Aires

# Retención de la tabla intentos_gemini (docs/auditoria-2026-09-facturas-
# reales.md, hallazgo C-9) -- una fila por cada llamada REAL a Gemini,
# nunca se purgaba, en una base gratuita con límite de espacio. 30 días da
# margen de sobra para diagnosticar un fallo reciente sin acumular para
# siempre.
dias_retencion_intentos_gemini: 30

# Cuántas veces reintentar una llamada a Gemini que falló por un error
# TRANSITORIO (503 demanda alta, 429 cuota agotada, timeout de red) antes
# de rendirse y dejar la factura como borrador vacío para completar a
# mano -- ver core/extraccion/gemini.py::es_error_transitorio y
# core/pipeline.py::procesar_pdf (docs/auditoria-2026-09-web.md, E-6). Un
# error PERMANENTE (sin API key, JSON mal formado) nunca se reintenta,
# sea cual sea este número. Cada intento cuenta como una llamada real
# contra max_llamadas_gemini_por_hora.
intentos_gemini_por_llamada: 3

# Espera base, en segundos, antes de cada reintento -- crece con cada
# intento (espera_base * intento: 2s, 4s, ...) para no golpear la API de
# nuevo de inmediato si sigue saturada.
espera_reintento_gemini_segundos: 2.0

# Tiempo máximo por intento HTTP; el SDK lo interpreta en milisegundos.
timeout_gemini_segundos: 90

# Se verifica antes de abrir el PDF y antes de conservarlo/enviarlo. El límite
# protege también las cargas por CLI, además del formulario web.
tamano_maximo_pdf_bytes: 10485760
