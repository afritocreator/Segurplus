name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Configurar git (lo necesitan los tests de scripts/ y hooks/)
        run: |
          git config --global user.email "ci@segurplus.local"
          git config --global user.name "CI"

      - name: ruff check
        run: ruff check .

      - name: pytest
        # GEMINI_API_KEY no está seteada en CI a propósito: los tests marcados
        # red_real se skipean solos (ver tests/extraccion/conftest.py).
        run: pytest -q
