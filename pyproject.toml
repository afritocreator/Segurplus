[project]
name = "segurplus"
version = "0.1.0"
description = "Análisis automatizado de facturas de servicios — control de evolución de gastos por proveedor"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "polars>=1.0",
    "plotly>=5.22",
    "streamlit>=1.63",  # >=1.63 para el tema con chartCategoricalColors, ver .streamlit/config.toml
    "openpyxl>=3.1",
    "pyarrow>=17.0",
    "requests>=2.32",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "google-genai>=0.3",
    "psycopg[binary]>=3.2",  # Postgres gratis (Neon/Supabase), ver ADR-003
    "pandas>=2.0",  # solo para st.data_editor en apps/segurplus/paginas/confirmar.py
    "fastapi>=0.115",  # web/ -- ver ADR-005, Bloque 4 del plan de rediseño
    "jinja2>=3.1",  # plantillas de web/, ya era dependencia transitiva de Streamlit
    "python-multipart>=0.0.9",  # FastAPI lo necesita para los formularios de web/subir
    "itsdangerous>=2.2",  # cookie de sesión firmada, web/auth.py
    "uvicorn>=0.30",  # servidor ASGI para correr web/app.py
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "reportlab>=4.0",
    "pymupdf>=1.24",  # tests de core/extraccion/proveedores/render.py
]
# Solo si se despliega con S3/R2 real para el PDF original -- el default del
# piloto guarda el PDF en una carpeta local (EVIDENCIA_DIR), ver
# core/evidencia.py y ADR-003. `pip install -e ".[s3]"` para sumarlo.
s3 = [
    "boto3>=1.35",
]
# Solo para probar un proveedor de extracción que reciba imagen en vez de
# PDF nativo (Groq y similares -- ver core/extraccion/proveedores/render.py
# y docs/decisiones/ADR-004-render-pdf-a-imagen.md). El pipeline real
# (core/pipeline.py) no la necesita: solo llama a Gemini, que recibe el PDF
# nativo. `pip install -e ".[vision]"` para sumarla.
vision = [
    "pymupdf>=1.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "red_real: pega contra una API real (Gemini o INDEC). Se skipea si no hay red o falta la API key.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core"]
